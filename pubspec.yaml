name: near_pro1
description: "ProNear - find trusted service providers near you."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  google_mlkit_face_detection: ^0.15.1
  flutter_animate: ^4.5.2
  google_mlkit_text_recognition: ^0.17.1
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  flutter_rating_bar: ^4.0.1
  speech_to_text: ^7.4.0
  provider: ^6.1.5+1
  go_router: ^17.5.0
  intl: ^0.20.3
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.0
  path_provider: ^2.1.5



dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"  # Background color for Android adaptive icon
  adaptive_icon_foreground: "assets/icon.png"  # Same logo for foreground
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpeg
    - assets/icon.png
    - assets/ali.jpeg
    - assets/imcs.jpeg